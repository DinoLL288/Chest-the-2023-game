name: Create Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            index.html
            chest-game.html
          body: |
            Play Chest in any modern browser.

            Public game link:
            https://dino288.github.io/Chest-the-2023-game/
